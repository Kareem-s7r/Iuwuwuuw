<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Lab Pro</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .stats { border: 1px solid #00ff00; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .card { border: 1px solid #00ff00; padding: 15px; margin-bottom: 15px; border-radius: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        h2 { border-bottom: 1px solid #00ff00; }
    </style>
</head>
<body>

    <div class="stats">
        الرتبة: مبتدئ | نقاط الخبرة (XP): <span id="xp">0</span>
    </div>

    <h1>CYBER LAB</h1>

    <div class="card">
        <h2>📚 الأكاديمية (من الصفر)</h2>
        <p>الدرس 1: مقدمة في الشبكات وأساسيات الـ IP.</p>
        <button onclick="addXP()">إتمام الدرس وكسب 10 XP</button>
    </div>

    <div class="card">
        <h2>🧪 مختبر التجارب</h2>
        <p>بيئة Termux لمحاكاة هجمات الـ Man-in-the-Middle.</p>
        <button onclick="alert('تفعيل بيئة الاختبار...')">بدء التجربة</button>
    </div>

    <div class="card">
        <h2>🤖 المعلم الذكي (AI)</h2>
        <p>اطرح سؤالك وسيقوم النظام بتحليله.</p>
        <input type="text" id="aiInput" placeholder="اسألني عن الأمن السيبراني..." style="width:100%; background:#000; color:#0f0; border:1px solid #0f0;">
        <button onclick="askAI()">إرسال للسؤال</button>
    </div>

    <script>
        let xp = 0;
        function addXP() {
            xp += 10;
            document.getElementById('xp').innerText = xp;
            alert("أحسنت! لقد زادت خبرتك.");
        }
        function askAI() {
            const question = document.getElementById('aiInput').value;
            alert("المعلم الذكي يحلل سؤالك: " + question + "\n(هذه ميزة الربط مع API الذكاء الاصطناعي)");
        }
    </script>
</body>
</html>
